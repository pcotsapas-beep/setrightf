# Set Right Flatwork: plain static site (HTML/CSS/JS, no framework, no package manager).
#
# The pages are generated by build.py, but the repository only contains its
# finished output in dist/. The static/ source folder that build.py copies
# from is not committed, so running build.py on Netlify would delete dist/
# and then fail. Netlify publishes the pre-built dist/ folder as is.
#
# If static/ is committed later, the build can run on Netlify instead:
#   command = "python3 build.py"
[build]
  publish = "dist"
  command = ""
